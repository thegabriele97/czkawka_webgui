[package]
name = "czkawka-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
czkawka_core = "12.0.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
