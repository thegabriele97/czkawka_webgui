name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bridge:
    name: Test bridge (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Build
        working-directory: bridge
        run: cargo build --release

      - name: Run contract tests
        working-directory: bridge
        run: cargo test --release

      - name: Upload bridge binary
        uses: actions/upload-artifact@v4
        with:
          name: czkawka-bridge
          path: bridge/target/release/czkawka-bridge

  test-backend:
    name: Test backend (Python)
    runs-on: ubuntu-latest
    needs: test-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download bridge binary
        uses: actions/download-artifact@v4
        with:
          name: czkawka-bridge
          path: bridge/target/release

      - name: Make bridge binary executable
        run: chmod +x bridge/target/release/czkawka-bridge

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_BRIDGE_BIN: ${{ github.workspace }}/bridge/target/release/czkawka-bridge
        run: pytest -q

  test-frontend:
    name: Test frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    needs: [test-bridge, test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base name
        id: image
        run: echo "base=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.base }}-backend:latest
            ${{ steps.image.outputs.base }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.base }}-frontend:latest
            ${{ steps.image.outputs.base }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
